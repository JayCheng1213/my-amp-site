name: Build and Deploy Vue Site

on:
  push:
    branches:
      - main 

permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: ./my-amp-site 
        run: npm install

      - name: Build Project
        working-directory: ./my-amp-site 
        run: npm run build

      - name: Deploy to Deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: my-amp-site/dist 
          branch: deploy 
          token: ${{ secrets.GITHUB_TOKEN }}
